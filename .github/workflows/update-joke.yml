name: Actualizar Chiste Diario

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generar imagen del chiste
        run: python .github/scripts/random_joke.py

      - name: Commit y Push del cambio
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Nuevo chiste diario generado"
          file_pattern: "output/joke-es.svg"
